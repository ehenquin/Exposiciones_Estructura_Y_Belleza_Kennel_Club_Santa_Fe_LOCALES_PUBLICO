<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultados en Vivo - Kennel Club Santa Fe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <img src="https://i.postimg.cc/Qtb1By5N/Logo-Kennel.jpg" />
      <h1>Resultados en Vivo</h1>
      <small>
        Desarrollado por
        <a href="https://ehenquin.github.io/LinkTreePro/" target="_blank">
          Dr. Eduardo R. Henquín
        </a>
      </small>
    </header>

    <div class="container">
      <label>COMPETENCIA</label>
      <select
        id="selectorEvento"
        class="select-nativo-compatible"
        tabindex="-1"
        aria-hidden="true"
      ></select>

      <label>JUEZ / PISTA</label>
      <select
        id="selectorJuez"
        class="select-nativo-compatible"
        tabindex="-1"
        aria-hidden="true"
        disabled
      ></select>

      <div>
        <button onclick="cargarResultados('razas')">Resultados Razas</button>
        <button onclick="cargarResultados('bis')">Finales BIS</button>
        <button onclick="cargarCatalogosPerrosInscriptos()">
          📖 Catálogos de Perros Inscriptos
        </button>
      </div>

      <div id="infoGeneral" class="bloque-info"></div>
      <div id="contenedorResultados"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
